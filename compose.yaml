services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: development
    user: "0:0"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: ["npx", "next", "dev", "--hostname", "0.0.0.0", "--port", "3010"]
    expose:
      - "3010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3021:80"
    environment:
      SPOTYNET_WEB_HOST: ${SPOTYNET_WEB_HOST:-spotynet.com www.spotynet.com spotynet-dev.spotynet.com}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  web_node_modules:
