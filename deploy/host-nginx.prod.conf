# Host nginx for Spotynet landing PRODUCTION (dedicated EC2).
# Proxies public hostnames to Compose project nginx on 127.0.0.1:8080.
# Install: sudo ./deploy/setup-prod-nginx.sh
# TLS:     sudo certbot --nginx -d spotynet.com -d www.spotynet.com

upstream spotynet_compose {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name spotynet.com www.spotynet.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://spotynet_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
